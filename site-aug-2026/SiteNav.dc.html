<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:140}}">
class Component extends DCLogic {
  state = { menuOpen: false, theme: 'dark', lang: 'en' };

  componentDidMount() {
    const root = document.documentElement;
    const saved = localStorage.getItem('wl-theme');
    const h = new Date().getHours();
    const theme = saved || (h >= 7 && h < 18 ? 'light' : 'dark');
    root.dataset.theme = theme;
    const lang = localStorage.getItem('wl-lang') || 'en';
    root.dataset.lang = lang;
    root.setAttribute('lang', lang);
    this.setState({ theme, lang });
    this.mq = window.matchMedia('(min-width: 1024px)');
    this.apply = () => {
      const desk = this.mq.matches;
      document.querySelectorAll('[data-desk="1"]').forEach(el => { el.style.display = desk ? 'flex' : 'none'; });
      document.querySelectorAll('[data-mob="1"]').forEach(el => {
        el.style.display = desk ? 'none' : (el.dataset.mobDisplay || 'block');
      });
      document.body.style.paddingBottom = desk ? '' : '56px';
      if (desk && this.state.menuOpen) this.setState({ menuOpen: false });
    };
    this.apply();
    this.mq.addEventListener('change', this.apply);
  }

  componentDidUpdate() { if (this.apply) this.apply(); }
  componentWillUnmount() { if (this.mq) this.mq.removeEventListener('change', this.apply); }

  renderVals() {
    return {
      menuOpen: this.state.menuOpen,
      themeLabel: this.state.theme === 'dark' ? 'Light' : 'Dark',
      langLabel: this.state.lang === 'en' ? 'ಕನ್ನಡ' : 'EN',
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      toggleTheme: () => {
        const theme = this.state.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        localStorage.setItem('wl-theme', theme);
        this.setState({ theme });
      },
      toggleLang: () => {
        const lang = this.state.lang === 'en' ? 'kn' : 'en';
        document.documentElement.dataset.lang = lang;
        document.documentElement.setAttribute('lang', lang);
        localStorage.setItem('wl-lang', lang);
        this.setState({ lang });
        if (window.westlineApplyLang) window.westlineApplyLang(lang);
      }
    };
  }
}
</script>
