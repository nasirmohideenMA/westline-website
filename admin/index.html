<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex">
  <title>Westline Admin</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0A0A0A;font-family:'Jost',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    window.netlifyIdentity && window.netlifyIdentity.on('init', user => {
      if (!user) {
        window.netlifyIdentity.on('login', () => {
          document.location.href = '/admin/';
        });
      }
    });
  </script>
</body>
</html>
