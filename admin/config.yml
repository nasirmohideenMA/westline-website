backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

site_url: https://velvety-starburst-4a4a2c.netlify.app
display_url: https://velvety-starburst-4a4a2c.netlify.app
logo_url: /images/slider/logo.png

collections:

  # ── HOMEPAGE SLIDER ──
  - name: "slider"
    label: "Homepage Slider"
    label_singular: "Slide"
    folder: "_data/slider"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Slide Title", name: "title", widget: "string"}
      - {label: "Subtitle", name: "subtitle", widget: "string", required: false}
      - {label: "Image", name: "image", widget: "image", media_folder: "/images/slider"}
      - {label: "Button Text", name: "btn_text", widget: "string", default: "View Project"}
      - {label: "Button Link", name: "btn_link", widget: "string", default: "/signature.html"}
      - {label: "Order", name: "order", widget: "number", default: 1}

  # ── WESTLINE SIGNATURE ──
  - name: "signature"
    label: "Westline Signature"
    files:
      - label: "Project Info"
        name: "signature_info"
        file: "_data/projects/signature.json"
        fields:
          - {label: "Project Name", name: "name", widget: "string", default: "Westline Signature"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Status", name: "status", widget: "select", options: ["Ongoing", "Completed", "Upcoming"]}
          - {label: "Type", name: "type", widget: "string"}
          - {label: "Location", name: "location", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - label: "YouTube Videos"
            name: "videos"
            widget: "list"
            fields:
              - {label: "Video Title", name: "title", widget: "string"}
              - {label: "YouTube Video ID", name: "youtube_id", widget: "string", hint: "Just the ID e.g. dQw4w9WgXcQ"}
              - {label: "Description", name: "description", widget: "string"}
          - label: "Gallery Images"
            name: "gallery"
            widget: "list"
            fields:
              - {label: "Image", name: "image", widget: "image", media_folder: "/images/signature/gallery"}
              - {label: "Caption", name: "caption", widget: "string", required: false}
              - {label: "Category", name: "category", widget: "select", options: ["gallery", "renders", "construction", "completed"]}
          - label: "Floor Plans"
            name: "floor_plans"
            widget: "list"
            fields:
              - {label: "Unit Type", name: "type", widget: "string", hint: "e.g. 3 BHK Premium"}
              - {label: "Size", name: "size", widget: "string", hint: "e.g. 1600 - 2000 sq ft"}
              - {label: "Floor Plan Image", name: "image", widget: "image", media_folder: "/images/signature/floor-plans"}
              - {label: "Availability", name: "availability", widget: "select", options: ["Available", "Limited", "Sold Out", "Rare"]}

  # ── CUBIX ──
  - name: "cubix"
    label: "Cubix"
    files:
      - label: "Project Info"
        name: "cubix_info"
        file: "_data/projects/cubix.json"
        fields:
          - {label: "Project Name", name: "name", widget: "string", default: "Cubix"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Status", name: "status", widget: "select", options: ["Ongoing", "Completed", "Upcoming"]}
          - {label: "Description", name: "description", widget: "text"}
          - label: "YouTube Videos"
            name: "videos"
            widget: "list"
            fields:
              - {label: "Video Title", name: "title", widget: "string"}
              - {label: "YouTube Video ID", name: "youtube_id", widget: "string"}
              - {label: "Description", name: "description", widget: "string"}
          - label: "Gallery Images"
            name: "gallery"
            widget: "list"
            fields:
              - {label: "Image", name: "image", widget: "image", media_folder: "/images/cubix/gallery"}
              - {label: "Caption", name: "caption", widget: "string", required: false}
              - {label: "Category", name: "category", widget: "select", options: ["gallery", "completed"]}
          - label: "Floor Plans"
            name: "floor_plans"
            widget: "list"
            fields:
              - {label: "Unit Type", name: "type", widget: "string"}
              - {label: "Size", name: "size", widget: "string"}
              - {label: "Floor Plan Image", name: "image", widget: "image", media_folder: "/images/cubix/floor-plans"}
              - {label: "Availability", name: "availability", widget: "select", options: ["Available", "Rental", "Operational", "Sold Out"]}

